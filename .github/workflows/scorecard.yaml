# OSSF Scorecard - Supply chain security analysis
# https://securityscorecards.dev/
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Saturdays at 06:00 UTC
    - cron: "0 6 * * 6"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard depends on GitHub's GraphQL API, which intermittently returns
    # 500s ("Something went wrong while executing your query"). Don't let
    # those transient errors mark the master build as failed; the weekly
    # scheduled run will re-collect results.
    continue-on-error: true

    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
